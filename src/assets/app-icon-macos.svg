<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cogitor macOS Dock icon">
  <!-- macOS Dock icon only: 52px transparent margin on every side.
       Artwork is 79.7% of the canvas, so it reads at the same visual size as
       other macOS squircle icons. The in-app/icon master stays edge-to-edge. -->
  <g transform="translate(52 52) scale(0.796875)">
    <rect width="512" height="512" rx="104" fill="#1A1612"/>
    <g fill="none" stroke="#EFE6D3" stroke-width="19" stroke-linecap="round">
      <path d="M 297 101 A 160 160 0 0 1 395 336"/>
      <path d="M 341 392 A 160 160 0 0 1 101 297"/>
      <path d="M 101 215 A 160 160 0 0 1 215 101"/>
    </g>
    <circle cx="256" cy="256" r="83" fill="#E38B45"/>
    <circle cx="285" cy="217" r="13" fill="#EFE6D3"/>
    <circle cx="256" cy="96" r="23" fill="#E38B45"/>
    <circle cx="96" cy="256" r="21" fill="#EFE6D3"/>
    <circle cx="359" cy="379" r="21" fill="#E38B45"/>
  </g>
</svg>
