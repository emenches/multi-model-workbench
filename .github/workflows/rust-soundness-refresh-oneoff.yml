name: Rust soundness warning refresh (one-time internal branch)

on:
  push:
    branches: [security/cogitor-deep-release-gates]
    paths: ['.github/workflows/rust-soundness-refresh-oneoff.yml']

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'emenches/multi-model-workbench' && github.ref == 'refs/heads/security/cogitor-deep-release-gates'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
      - name: Upgrade soundness-affected compatible libraries
        run: |
          set -euo pipefail
          cargo update --manifest-path src-tauri/Cargo.toml -p tokio --precise 1.54.1
          cargo update --manifest-path src-tauri/Cargo.toml -p event-listener --precise 5.4.2
          git diff --stat -- src-tauri/Cargo.lock
      - name: Push only the resolved lockfile to the internal PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add -- src-tauri/Cargo.lock
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): remediate Tokio and event-listener soundness advisories'
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:refs/heads/security/cogitor-deep-release-gates
