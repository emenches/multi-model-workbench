name: Rust dependency graph refresh (one-time internal branch)

on:
  push:
    branches: [security/cogitor-deep-release-gates]
    paths: ['.github/workflows/rust-lock-refresh-oneoff.yml']

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'emenches/multi-model-workbench' && github.ref == 'refs/heads/security/cogitor-deep-release-gates'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16

      - name: Refresh only affected compatible Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo update --manifest-path src-tauri/Cargo.toml \
            -p quinn-proto \
            -p rustls \
            -p rustls-webpki \
            -p webpki-roots \
            -p webpki-root-certs \
            -p quick-xml \
            -p plist
          echo "Dependencies upgraded inside their permitted semver ranges."
          git diff --stat -- src-tauri/Cargo.lock
          git diff -- src-tauri/Cargo.lock | grep -E '^[-+]name =|^[-+]version =' | head -80 || true

      - name: Commit reviewed lockfile refresh to this internal branch only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): update RustSec-affected transitive dependencies'
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:refs/heads/security/cogitor-deep-release-gates
