name: Dependency lock refresh proposal (temporary, read-only)

on:
  pull_request:
    paths:
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/lockfile-refresh-diff.yml

permissions:
  contents: read

jobs:
  propose:
    if: github.head_ref == 'security/cogitor-deep-release-gates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Print lockfile-only patch for audited manual application
        shell: bash
        run: |
          echo 'COGITOR_LOCK_DIFF_BEGIN'
          git --no-pager diff --unified=3 -- pnpm-lock.yaml
          echo 'COGITOR_LOCK_DIFF_END'
