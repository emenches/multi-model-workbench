name: Cogitor macOS Preview

on:
  push:
    branches:
      - preview/cogitor-unified-macos
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cogitor-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-universal:
    name: Test and build Cogitor universal DMG
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout integrated preview source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify frontend, injected scripts, tests and adapters
        run: pnpm verify

      - name: Verify Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Check Rust formatting (advisory in test preview)
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Build Cogitor for Intel and Apple Silicon
        run: pnpm tauri build --bundles dmg --target universal-apple-darwin

      - name: Verify and package DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "No universal macOS DMG was built" >&2
            exit 1
          fi
          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse -quiet
          app="$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app" ]]; then
            echo "No .app inside DMG" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$signature"
          if ! grep -Eq '^(Signature=adhoc|Authority=Developer ID Application:)' <<< "$signature"; then
            echo "DMG app missing valid ad-hoc or Developer ID signature" >&2
            exit 1
          fi
          binary="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -perm +111 -print -quit 2>/dev/null || true)"
          if [[ -n "$binary" ]]; then
            lipo -info "$binary"
          fi
          mkdir -p dist-preview
          cp "$dmg" dist-preview/Cogitor-preview-universal.dmg
          (cd dist-preview && shasum -a 256 Cogitor-preview-universal.dmg > SHA256SUMS.txt)

      - name: Upload test installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cogitor-macos-universal-preview
          path: dist-preview/
          retention-days: 14
          if-no-files-found: error
