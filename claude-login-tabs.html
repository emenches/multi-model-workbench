<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude sign-in tabs</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color-scheme: dark;
        background: #17191e;
        color: #e6e6e8;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 0; overflow: hidden; font-size: 14px; }
      #bar {
        height: 76px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 16px;
        background: #1c1e24;
        box-shadow: 0 4px 14px rgba(0,0,0,.30);
      }
      button {
        font: inherit;
        font-weight: 600;
        min-height: 44px;
        cursor: pointer;
        color: #bfc2cb;
        border: 0;
        border-radius: 12px;
        padding: 10px 18px;
        background: transparent;
        white-space: nowrap;
      }
      button.active { background: #393d47; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.22); }
      button:hover { background: #343843; color: #fff; }
      button:focus-visible,input:focus-visible { outline: 2px solid #91b2ff; outline-offset: 2px; }
      #navigation { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
      #go { min-width: 68px; background: #495466; color: #fff; }
      #address {
        background: #101217;
        color: #f4f4f5;
        min-height: 44px;
        border: 1px solid #454954;
        border-radius: 12px;
        min-width: 100px;
        flex: 1;
        padding: 10px 14px;
        font: inherit;
      }
      #close-email { font-size: 22px; padding: 7px 14px; }
      #status { max-width: 195px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #d4cfb3; font-size: 13px; }
      .hidden { display: none !important; }
    </style>
    <script type="module" src="/src/claudeLoginTabs.ts"></script>
  </head>
  <body>
    <div id="bar" role="toolbar" aria-label="Claude login tabs">
      <button type="button" id="claude" class="active" aria-label="Claude tab">Claude</button>
      <button type="button" id="email" aria-label="Open email tab">+ Email</button>
      <form id="navigation" class="hidden">
        <input id="address" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="Webmail address or paste Claude sign-in link" aria-label="Email website address" />
        <button type="submit" id="go">Go</button>
        <button type="button" id="close-email" title="Close email tab" aria-label="Close email tab">×</button>
      </form>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
  </body>
</html>
